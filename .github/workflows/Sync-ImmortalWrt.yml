name: Sync ImmortalWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: VIKINGYFY/immortalwrt
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config user.name "PoorMilk"
          git config user.email "PoorMilk@users.noreply.github.com"
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}"
          git fetch origin
          git fetch upstream
          git reset --hard "upstream/${{ env.UPSTREAM_BRANCH }}"
          git checkout origin/main -- .github README.md
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Sync upstream and preserve custom files"
            git push -f origin main
          fi

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --limit 100 --json databaseId \
            --jq '.[5:] | .[].databaseId' | while read -r run_id; do
              [ -n "$run_id" ] && gh run delete "$run_id" --repo "${{ github.repository }}"
            done
